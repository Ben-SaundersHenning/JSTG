appenders:
    logfile:
        kind: rolling_file
        path: "$ENV{JSTG_LOG_DIR}/jstg.log"
        encoder:
            pattern: "{d(%H:%M:%S)} [{l}] \\({f}:{L}\\) - {m}{n}"
        policy:
            kind: compound
            trigger:
                kind: time
                interval: 1 day
                modulate: true
            roller:
                kind: fixed_window
                base: 1
                count: 5
                pattern: "$ENV{JSTG_LOG_DIR}/archive/jstg.{}.log"

loggers:
    jstg:
        level: info
        appenders:
            - logfile

    jstg_lib:
        level: info
        appenders:
          - logfile
        additive: false
